repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-toml
      - id: debug-statements
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: bandit
        name: bandit
        entry: uv run bandit --confidence-level 'medium' --severity-level 'medium' --exclude test
        language: system
        pass_filenames: true
        types: ['python']

      - id: ssort
        name: ssort
        entry: uv run ssort --check
        language: system
        pass_filenames: true
        types: ['python']

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        pass_filenames: true
        types: ['python']

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        pass_filenames: true
        types: ['python']

      - id: ty-check
        name: ty check
        entry: uv run ty check
        language: system
        pass_filenames: true
        types: ['python']
